# Options
set maximum-size 50M
set delete-oversized

# Actie: Virus scanning with ClamAV
action "clamav_scan" pipe "/usr/bin/clamdscan --stdout --no-summary -"

# Actie: Spam scanning with SpamAssassin
action "spamassassin_scan" pipe "/usr/bin/spamc"

# Actie: Deliver to Dovecot LDA
action "deliver_via_dovecot" exec "/usr/local/bin/dovecot-lda-wrapper %a"

# Accounts
account "corianne_gmail" maildir "/home/mail/vhosts/kwee.cumail.nl/corianne/Maildir/Gmail/INBOX"
account "corianne_hcc" maildir "/home/mail/vhosts/kwee.cumail.nl/corianne/Maildir/HCC/INBOX"
account "corianne_kpn" maildir "/home/mail/vhosts/kwee.cumail.nl/corianne/Maildir/KPN/INBOX"
account "corianne_yahoo" maildir "/home/mail/vhosts/kwee.cumail.nl/corianne/Maildir/Yahoo/INBOX"
account "rene_gmail" maildir "/home/mail/vhosts/kwee.cumail.nl/rene/Maildir/Gmail/INBOX"
account "rene_hcc" maildir "/home/mail/vhosts/kwee.cumail.nl/rene/Maildir/HCC/INBOX"
account "rene_kpn" maildir "/home/mail/vhosts/kwee.cumail.nl/rene/Maildir/KPN/INBOX"
account "rene_yahoo" maildir "/home/mail/vhosts/kwee.cumail.nl/rene/Maildir/Yahoo/INBOX"
account "wilma_gmail" maildir "/home/mail/vhosts/kwee.cumail.nl/wilma/Maildir/Gmail/INBOX"
account "wilma_hcc" maildir "/home/mail/vhosts/kwee.cumail.nl/wilma/Maildir/HCC/INBOX"
account "wilma_kpn" maildir "/home/mail/vhosts/kwee.cumail.nl/wilma/Maildir/KPN/INBOX"
